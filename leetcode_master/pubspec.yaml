name: leetcode_master
description: "Master algorithmic patterns for technical interviews"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_ui_auth: ^3.0.1
  cloud_firestore: ^6.1.2

  # HTTP & Caching
  dio: ^5.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Code Editor

  # UI
  google_fonts: ^6.2.1

  # Utils
  shared_preferences: ^2.3.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
